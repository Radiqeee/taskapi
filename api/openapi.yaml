openapi: 3.0.3
info:
  title: Task API
  version: 1.0.0
  description: REST API for personal task management with JWT authentication.
servers:
  - url: /api/v1

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, minLength: 8, maxLength: 72, example: supersecret }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        done: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTask:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200, example: Write README }
        description: { type: string, maxLength: 2000 }
    UpdateTask:
      type: object
      description: Send only the fields you want to change.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        done: { type: boolean }
    TaskList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        limit: { type: integer }
        offset: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }
  parameters:
    TaskID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Task not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Create an account
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } }
      responses:
        '201':
          description: Registered
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /auth/login:
    post:
      tags: [auth]
      summary: Get a JWT token
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } }
      responses:
        '200':
          description: Logged in
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tasks:
    get:
      tags: [tasks]
      summary: List your tasks (newest first)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: done, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Tasks
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tasks]
      summary: Create a task
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTask' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskID'
    get:
      tags: [tasks]
      summary: Get a task
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Task
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tasks]
      summary: Update a task
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTask' } } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tasks]
      summary: Delete a task
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
